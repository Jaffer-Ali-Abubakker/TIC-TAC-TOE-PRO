# Tic-Tac-Toe Pro - Supabase project configuration
#
#   supabase start          # run a local Supabase stack (requires Docker)
#   supabase db reset       # apply every migration to the local database
#   supabase db push        # apply the migrations to the linked cloud project
#   supabase test db        # run the database tests
#
# The migrations in supabase/migrations create everything the online mode
# needs: tables, row level security policies and the trusted game functions.

project_id = "tic-tac-toe-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
schema_paths = ["./supabase/migrations"]

[db.seed]
sql_paths = ["./supabase/seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Anonymous sign-in is required for the casual online multiplayer mode.
enable_anonymous_sign_ins = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true
# Private channels are used for the online room channels. The migration
# installs the matching authorisation policy on `realtime.messages`.
authorization = true
